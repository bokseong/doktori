<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f0e6">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>로그인 · 복성고 독토리</title>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./footer.css">
    <style>
        body { display: grid; place-items: center; padding: 28px 16px; }
        .auth-shell { width: min(920px, 100%); display: grid; grid-template-columns: .85fr 1.15fr; }
        .auth-poster { position: relative; padding: clamp(28px, 6vw, 60px); color: var(--paper-strong); background: var(--ink); overflow: hidden; }
        .auth-poster::after { content: "D"; position: absolute; right: -25px; bottom: -70px; color: var(--lime); font: 18rem/.8 "Black Han Sans", sans-serif; opacity: .92; }
        .auth-poster h1 { position: relative; z-index: 1; margin: 18px 0; font: clamp(3rem, 8vw, 5.8rem)/.88 "Black Han Sans", sans-serif; }
        .auth-poster p { position: relative; z-index: 1; max-width: 320px; line-height: 1.7; }
        .auth-card { padding: clamp(28px, 6vw, 58px); background: var(--paper-strong); }
        .auth-card h2 { margin: 0 0 10px; font: 2rem "Black Han Sans", sans-serif; }
        .step { display: inline-block; margin-bottom: 18px; color: var(--blue); font-weight: 700; }
        .full { width: 100%; }
        .helper { margin: 8px 0 22px; color: var(--muted); line-height: 1.6; }
        .auth-note { margin: 22px 0 0; padding: 14px 16px; border: 2px solid var(--ink); background: var(--paper); color: var(--muted); line-height: 1.6; }
        #message { min-height: 1.5em; margin: 18px 0 0; color: #9b321e; font-weight: 700; }
        @media (max-width: 700px) { .auth-shell { grid-template-columns: 1fr; } .auth-poster { min-height: 250px; } .auth-poster::after { font-size: 12rem; } }
    </style>
</head>
<body>
    <main class="auth-shell panel">
        <section class="auth-poster" aria-label="독토리 소개">
            <span class="label">BOKSEONG LIBRARY</span>
            <h1>책 사이의<br>비밀 통로</h1>
            <p>QR을 찾고, 단서를 풀고, 나만의 탐험 기록을 남겨 보세요.</p>
        </section>
        <section class="auth-card">
            <span class="step">01 · 계정 확인</span>
            <h2>Google로 로그인</h2>
            <p class="helper">진행도를 개인별로 안전하게 저장하기 위해 학교에서 사용하는 Google 계정으로 로그인합니다.</p>
            <button id="googleSignInButton" class="full" type="button">Google 계정으로 로그인</button>
            <p class="auth-note">처음 참여하는 계정은 로그인 후 별도의 회원 등록 페이지에서 학번·이름 입력과 개인정보 수집·이용 동의를 진행합니다.</p>
            <p id="message" role="status"></p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__identity"><strong>복성고 도서부 · 독토리</strong><span>학교 곳곳의 단서를 찾는 QR 미션</span></div>
        <small>© 2026 복성고등학교 도서부</small>
    </footer>

    <script type="module" src="./app-ui.js"></script>
    <script type="module">
        import {
            getSafeNext,
            getMemberProfile,
            isMemberProfileComplete,
            signInWithGoogle,
            touchMemberProfile,
            waitForAuth
        } from "./auth.js";

        const message = document.getElementById("message");
        const signInButton = document.getElementById("googleSignInButton");

        async function continueWith(user) {
            const profile = await getMemberProfile(user);
            if (isMemberProfileComplete(profile)) {
                message.textContent = "회원 정보를 확인했습니다. 이동하는 중...";
                await touchMemberProfile(user);
                location.replace(getSafeNext());
                return;
            }

            message.textContent = "회원 등록 페이지로 이동하는 중...";
            const registerUrl = new URL("./register.html", location.href);
            registerUrl.searchParams.set("next", getSafeNext());
            location.replace(registerUrl);
        }

        signInButton.disabled = true;
        try {
            const existingUser = await waitForAuth();
            if (existingUser) {
                await continueWith(existingUser);
            } else {
                signInButton.disabled = false;
            }
        } catch (error) {
            console.error(error);
            message.textContent = "로그인 상태를 확인하지 못했습니다. 잠시 후 다시 시도하세요.";
            signInButton.disabled = false;
        }

        signInButton.addEventListener("click", async () => {
            signInButton.disabled = true;
            message.textContent = "Google 로그인 중...";
            try {
                await continueWith(await signInWithGoogle());
            } catch (error) {
                console.error(error);
                message.textContent = error.code === "auth/popup-closed-by-user"
                    ? "로그인 창이 닫혔습니다."
                    : "로그인하지 못했습니다. 잠시 후 다시 시도하세요.";
                signInButton.disabled = false;
            }
        });

    </script>
</body>
</html>
