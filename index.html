<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복성고 독토리</title>
    <style>body { visibility: hidden; }</style>
</head>
<body>
    <header>
        <span id="userInfo"></span>
        <button id="logoutButton" type="button">로그아웃</button>
    </header>
    <main>
        <h1>복성고 독토리</h1>
        <nav aria-label="콘텐츠 메뉴">
            <a href="qr/1.html">1번 이미지</a><br>
            <a href="qr/2.html">2번 이미지</a><br>
            <a href="qr/3.html">3번 이미지</a><br>
            <a href="game/roulette.html">돌림판</a><br>
            <a href="game/Ladder.html">사다리</a><br>
            <a href="qr/QR.html">QR 코드 생성</a><br>
        </nav>
    </main>
    <script type="module">
        import { requireUser, logout } from "./auth.js";

        const user = await requireUser();
        document.getElementById("userInfo").textContent = user.displayName || user.email || "사용자";
        document.getElementById("logoutButton").addEventListener("click", logout);
        document.body.style.visibility = "visible";
    </script>
</body>
</html>
