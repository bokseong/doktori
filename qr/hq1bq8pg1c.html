<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f0e6">
    <link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon.svg" type="image/svg+xml">
    <title>QR 02 · 복성고 독토리</title>
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>
    <main class="qr-shell">
        <header class="qr-top">
            <div class="qr-brand">DOKTORI GENERAL MODE</div>
            <span class="qr-index">QR 02</span>
        </header>
        <div class="qr-grid">
            <section class="specter" aria-label="2번 이미지 영역">
                <div class="placeholder" role="img" aria-label="2번 귀신 이미지 준비 중">
                    <span class="ghost">👻</span>
                    <small>IMAGE SLOT 02</small>
                </div>
            </section>
            <section class="mission panel">
                <span class="mission-kicker">GENERAL QR 02 / 06</span>
                <h1>단서를<br>해독하세요</h1>
                <p class="mission-copy">QR 보물찾기 문제입니다. 아래 문제의 답을 입력하면 진행도가 기록됩니다.</p>
                <div class="quiz-card">
                    <h2 id="quizQuestion"></h2>
                    <form id="quizForm">
                        <label for="answerInput">정답</label>
                        <input id="answerInput" type="text" autocomplete="off" required>
                        <button id="answerButton" type="submit">정답 확인</button>
                    </form>
                    <p id="quizMessage" class="quiz-message" role="status"></p>
                </div>
            </section>
        </div>
    </main>
    <footer class="site-footer">
        <div class="site-footer__identity"><strong>복성고 도서부 · 독토리</strong><span>학교 곳곳의 단서를 찾는 QR 미션</span></div>
        <div class="site-footer__meta"><a class="site-footer__link" href="../support/info.html">사이트 안내 · 이용약관</a><div class="site-footer__legal">
                <small>© 2026 복성고등학교 도서부 (독토리)</small>
                <small class="site-footer__credit">Designed by <a href="https://github.com/jw-astro09" target="_blank" rel="noopener noreferrer">jw-astro09</a></small>
            </div></div>
    </footer>
    <script type="module" src="../js/app-ui.js"></script>
    <script type="module">
        import { initQuiz } from "../js/quiz.js";
        await initQuiz("qr2", "normal");
    </script>
</body>
</html>
