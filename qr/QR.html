<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복성고 독토리</title>
    <link rel="stylesheet" href="../footer.css">
    <style>
        body {
            visibility: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .qr-box {
            margin-top: 20px;
            display: none;
        }
        .qr-box canvas,
        .qr-box img {
            max-width: 100%;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            background: #fff;
        }
        .download-btn {
            background-color: #28a745;
            margin-top: 10px;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>QR코드 생성기</h2>
        <input type="text" id="textInput" placeholder="URL 또는 텍스트를 입력하세요">
        <button id="generateButton" type="button">QR코드 생성</button>

        <div class="qr-box" id="qrBox">
            <div id="qrCode" aria-label="생성된 QR 코드"></div>
            <br>
            <button id="downloadButton" class="download-btn" type="button">QR코드 다운로드</button>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer__identity"><strong>복성고 도서부 · 독토리</strong><span>학교 곳곳의 단서를 찾는 QR 미션</span></div>
        <nav class="site-footer__links" aria-label="하단 메뉴"><a href="../index.html">홈으로</a></nav>
        <small>© 2026 복성고등학교 도서부</small>
    </footer>

    <script src="./qrcode.min.js"></script>
    <script type="module">
        import { getUserAccess, requireUser } from "../auth.js";

        const currentUser = await requireUser();
        const access = await getUserAccess(currentUser);
        if (!access.isAdmin) {
            location.replace(new URL("../index.html", location.href));
            await new Promise(() => {});
        }
        document.body.style.visibility = "visible";

        const input = document.getElementById("textInput");
        const qrBox = document.getElementById("qrBox");
        const qrCode = document.getElementById("qrCode");
        let currentQRDataUrl = "";

        function generateQR() {
            const textInput = input.value.trim();

            if (!textInput) {
                alert("텍스트나 URL을 입력해주세요!");
                return;
            }

            qrCode.replaceChildren();
            new QRCode(qrCode, {
                text: textInput,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            const canvas = qrCode.querySelector("canvas");
            currentQRDataUrl = canvas ? canvas.toDataURL("image/png") : "";
            qrBox.style.display = "block";
        }

        function downloadQR() {
            if (!currentQRDataUrl) return;
            const link = document.createElement("a");
            link.href = currentQRDataUrl;
            link.download = "qrcode.png";
            link.click();
        }

        document.getElementById("generateButton").addEventListener("click", generateQR);
        document.getElementById("downloadButton").addEventListener("click", downloadQR);
        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") generateQR();
        });
    </script>

</body>
</html>
