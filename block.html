<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 차단 - 복성고 독토리</title>
</head>
<body>
    <main>
        <h1>접근할 수 없습니다</h1>
        <p id="reason"></p>
        <a id="action" href="./signin.html">로그인 페이지로 이동</a>
    </main>
    <script>
        const permissionDenied = new URLSearchParams(location.search).get("reason") === "permission";
        document.getElementById("reason").textContent = permissionDenied
            ? "이 페이지를 이용할 권한이 없습니다."
            : "로그인한 사용자만 이용할 수 있습니다.";
        if (permissionDenied) {
            document.getElementById("action").textContent = "QR 페이지로 이동";
            document.getElementById("action").href = "./qr/QR.html";
        }
    </script>
</body>
</html>
