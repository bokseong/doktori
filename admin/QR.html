<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f0e6">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <title>QR 제작 · 복성고 독토리</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/footer.css">
    <style>
        body { visibility: hidden; }
        .builder-shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
        .builder-intro { margin-bottom: 26px; }
        .builder-intro h1 { margin: 16px 0 8px; font: clamp(2.8rem, 7vw, 4.8rem)/1.08 "Black Han Sans", sans-serif; letter-spacing: -.025em; }
        .builder-intro p { max-width: 680px; margin: 0; color: var(--muted); line-height: 1.7; }
        .builder-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); gap: 24px; align-items: start; }
        .builder-controls, .qr-box { padding: clamp(22px, 4vw, 34px); }
        .builder-controls h2, .qr-box h2 { margin: 0 0 16px; font-size: 1.55rem; font-weight: 800; line-height: 1.35; }
        .preset-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 24px; }
        .preset-grid button { min-width: 0; color: var(--cream); background: var(--paper-strong); }
        .preset-grid button[aria-pressed="true"] { background: var(--lime); transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
        .field { display: grid; gap: 8px; }
        .field label { font-weight: 700; }
        .field input { width: 100%; padding: 13px; border: 2px solid var(--line); color: var(--cream); background: var(--paper); }
        .field small { color: var(--muted); line-height: 1.5; }
        .builder-actions, .qr-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        .builder-actions > *, .qr-actions > * { flex: 1 1 150px; }
        .qr-box { text-align: center; }
        #qrCode { min-height: 224px; display: grid; place-items: center; }
        #qrCode canvas, #qrCode img { max-width: 100%; padding: 10px; border: 2px solid var(--ink); background: white; }
        #builderStatus { min-height: 1.5em; margin: 16px 0 0; color: var(--danger); font-weight: 700; }
        #printSheet { display: none; }
        @media print {
            body > :not(#printSheet) { display: none !important; }
            #printSheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18mm; padding: 10mm; }
            .print-qr { break-inside: avoid; text-align: center; font: 700 18pt/1.4 sans-serif; }
            .print-qr img { display: block; width: 62mm; height: 62mm; margin: 0 auto 4mm; }
            .print-qr small { display: block; font-size: 9pt; overflow-wrap: anywhere; }
        }
        @media (max-width: 720px) { .builder-grid { grid-template-columns: 1fr; } .builder-shell { padding-top: 28px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand"><span class="brand-mark">Q</span><span class="brand-text">독토리 QR 제작소</span></div>
        <nav class="account"><a class="button button--paper" href="./index.html">통합 관리자</a><a class="button button--paper" href="../index.html">메인으로</a></nav>
    </header>

    <main class="builder-shell">
        <section class="builder-intro"><span class="label">ADMIN TOOL</span><h1>QR 코드 제작</h1><p>QR 번호를 선택하면 현재 사이트의 정확한 문제 주소가 자동으로 입력됩니다. 직접 입력한 주소나 텍스트로도 만들 수 있습니다.</p></section>
        <div class="builder-grid">
            <section class="builder-controls panel" aria-labelledby="presetTitle">
                <h2 id="presetTitle">문제 QR 선택</h2>
                <div id="presetGrid" class="preset-grid" aria-label="QR 번호 선택">
                    <button type="button" data-qr="1">QR 01</button><button type="button" data-qr="2">QR 02</button><button type="button" data-qr="3">QR 03</button>
                    <button type="button" data-qr="4">QR 04</button><button type="button" data-qr="5">QR 05</button><button type="button" data-qr="6">QR 06</button>
                </div>
                <div class="field">
                    <label for="modeInput">QR 종류</label>
                    <select id="modeInput"><option value="normal">일반 모드 전용 QR</option><option value="story">스토리 모드 전용 QR (BS-001)</option></select>
                    <small>일반 모드와 스토리 모드는 서로 다른 QR 주소를 사용합니다.</small>
                </div>
                <div class="field">
                    <label for="textInput">QR에 넣을 주소 또는 텍스트</label>
                    <input type="text" id="textInput" placeholder="URL 또는 텍스트를 입력하세요" autocomplete="off">
                    <small>인쇄 전에 주소가 올바른지 한 번 스캔해 확인하세요.</small>
                </div>
                <div class="builder-actions"><button id="generateButton" class="button--coral" type="button">QR 다시 만들기</button><button id="copyButton" class="button--paper" type="button">주소 복사</button><button id="downloadAllButton" class="button--paper" type="button">1~6 ZIP 다운로드</button><button id="printAllButton" class="button--paper" type="button">1~6 인쇄용 보기</button></div>
                <p id="builderStatus" role="status" aria-live="polite"></p>
            </section>

            <section class="qr-box panel" id="qrBox" aria-labelledby="previewTitle">
                <h2 id="previewTitle">미리보기</h2>
                <div id="qrCode" aria-label="생성된 QR 코드"></div>
                <div class="qr-actions"><button id="downloadButton" class="button--coral" type="button">PNG 다운로드</button></div>
            </section>
        </div>
    </main>

    <section id="printSheet" aria-label="QR 1~6 인쇄 용지"></section>

    <footer class="site-footer">
        <div class="site-footer__identity"><strong>복성고 도서부 · 독토리</strong><span>학교 곳곳의 단서를 찾는 QR 미션</span></div>
        <div class="site-footer__meta"><a class="site-footer__link" href="../support/info.html">사이트 안내 · 이용약관</a><div class="site-footer__legal">
                <small>© 2026 복성고등학교 도서부</small>
                <small class="site-footer__credit">Designed by <a href="https://github.com/jw-astro09" target="_blank" rel="noopener noreferrer">jw-astro09</a>(<a href="https://bokseong.github.io/DEEPSKY/" target="_blank" rel="noopener noreferrer">DEEP SKY</a>)</small>
            </div></div>
    </footer>

    <script src="../js/vendor/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
    <script type="module" src="../js/app-ui.js"></script>
    <script type="module">
        import { adminAccess as access, adminUser as currentUser, requireHubEntry } from "../js/admin-guard.js";

        if (!requireHubEntry()) await new Promise(() => {});
        if (!access.isGrade1) {
            location.replace(new URL("../index.html", location.href));
            await new Promise(() => {});
        }
        document.body.style.visibility = "visible";

        const input = document.getElementById("textInput");
        const modeInput = document.getElementById("modeInput");
        const qrBox = document.getElementById("qrBox");
        const qrCode = document.getElementById("qrCode");
        const status = document.getElementById("builderStatus");
        const presetButtons = [...document.querySelectorAll("[data-qr]")];
        let currentQRDataUrl = "";
        let selectedQrNumber = null;
        const QR_ROUTES = Object.freeze([
            "299az81a68c", "hq1bq8pg1c", "iq1bz5iutx",
            "qrxc7ij88f", "eq4bunq5v", "jk1ba63db"
        ]);
        const STORY_QR_ROUTES = Object.freeze([
            "bs001-01", "bs001-02", "bs001-03",
            "bs001-04", "bs001-05", "bs001-06"
        ]);

        function missionUrl(number) {
            const story = modeInput.value === "story";
            const route = story ? STORY_QR_ROUTES[number - 1] : QR_ROUTES[number - 1];
            return new URL(`../qr/${story ? "story/" : ""}${route}.html`, location.href).href;
        }

        function generateQR() {
            const textInput = input.value.trim();

            if (!textInput) {
                status.textContent = "주소나 텍스트를 입력해 주세요.";
                input.focus();
                return;
            }

            qrCode.replaceChildren();
            new QRCode(qrCode, {
                text: textInput,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            const canvas = qrCode.querySelector("canvas");
            const image = qrCode.querySelector("img");
            currentQRDataUrl = canvas ? canvas.toDataURL("image/png") : (image?.src || "");
            const type = modeInput.value === "story" ? "스토리" : "일반";
            status.textContent = selectedQrNumber ? `${type} QR ${String(selectedQrNumber).padStart(2, "0")} 코드를 만들었습니다.` : "QR 코드를 만들었습니다.";
        }

        function selectQr(number) {
            selectedQrNumber = number;
            input.value = missionUrl(number);
            presetButtons.forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.qr) === number)));
            generateQR();
        }

        function downloadQR() {
            if (!currentQRDataUrl) return;
            const link = document.createElement("a");
            link.href = currentQRDataUrl;
            const prefix = modeInput.value === "story" ? "doktori-story-qr" : "doktori-qr";
            link.download = selectedQrNumber ? `${prefix}-${String(selectedQrNumber).padStart(2, "0")}.png` : "doktori-qrcode.png";
            link.click();
            status.textContent = "QR 이미지 다운로드를 시작했습니다.";
        }

        function createQrDataUrl(number) {
            const container = document.createElement("div");
            new QRCode(container, {
                text: missionUrl(number),
                width: 600,
                height: 600,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            const canvas = container.querySelector("canvas");
            const image = container.querySelector("img");
            return canvas ? canvas.toDataURL("image/png") : (image?.src || "");
        }

        async function downloadAllQr() {
            const button = document.getElementById("downloadAllButton");
            if (!window.JSZip) {
                status.textContent = "ZIP 모듈을 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.";
                return;
            }
            button.disabled = true;
            status.textContent = "QR 6개를 ZIP 파일로 묶는 중...";
            try {
                const zip = new JSZip();
                for (let number = 1; number <= 6; number += 1) {
                    const prefix = modeInput.value === "story" ? "doktori-story-qr" : "doktori-qr";
                    zip.file(`${prefix}-${String(number).padStart(2, "0")}.png`, createQrDataUrl(number).split(",")[1], { base64: true });
                }
                const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = objectUrl;
                link.download = "doktori-qr-01-06.zip";
                link.click();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
                status.textContent = `${modeInput.value === "story" ? "스토리" : "일반"} QR 1~6 ZIP 다운로드를 시작했습니다.`;
            } catch (error) {
                console.error(error);
                status.textContent = "ZIP 파일을 만들지 못했습니다.";
            } finally {
                button.disabled = false;
            }
        }

        function printAllQr() {
            const sheet = document.getElementById("printSheet");
            sheet.replaceChildren();
            for (let number = 1; number <= 6; number += 1) {
                const card = document.createElement("article");
                card.className = "print-qr";
                const image = new Image();
                image.src = createQrDataUrl(number);
                image.alt = `독토리 QR ${number}`;
                const label = document.createElement("strong");
                label.textContent = `${modeInput.value === "story" ? "BS-001 스토리" : "독토리 일반"} QR ${String(number).padStart(2, "0")}`;
                const address = document.createElement("small");
                address.textContent = missionUrl(number);
                card.append(image, label, address);
                sheet.append(card);
            }
            window.print();
        }

        async function copyValue() {
            const value = input.value.trim();
            if (!value) return;
            try {
                await navigator.clipboard.writeText(value);
                status.textContent = "주소를 클립보드에 복사했습니다.";
            } catch (error) {
                console.error(error);
                status.textContent = "자동 복사에 실패했습니다. 입력칸의 주소를 직접 복사해 주세요.";
                input.select();
            }
        }

        document.getElementById("generateButton").addEventListener("click", generateQR);
        document.getElementById("downloadButton").addEventListener("click", downloadQR);
        document.getElementById("copyButton").addEventListener("click", copyValue);
        document.getElementById("downloadAllButton").addEventListener("click", downloadAllQr);
        document.getElementById("printAllButton").addEventListener("click", printAllQr);
        presetButtons.forEach((button) => button.addEventListener("click", () => selectQr(Number(button.dataset.qr))));
        modeInput.addEventListener("change", () => selectQr(selectedQrNumber || 1));
        input.addEventListener("input", () => {
            selectedQrNumber = null;
            presetButtons.forEach((button) => button.setAttribute("aria-pressed", "false"));
        });
        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") generateQR();
        });
        selectQr(1);
    </script>

</body>
</html>
